<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5c4d" />
    <title>Sem conexão | Mercatto</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f6f4; color: #14211c; }
      main { max-width: 420px; text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #4b5d55; line-height: 1.5; margin: 0 0 20px; }
      button { background: #0b5c4d; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #f5b400; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0b5c4d"/><path d="M10 29V18.5a4.5 4.5 0 0 1 9 0V29M19 18.5a4.5 4.5 0 0 1 9 0V25" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24.6 22.6 28 26.2l3.6-3.6" fill="none" stroke="#f5b400" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet e tente novamente. Seu carrinho e seus pedidos continuam salvos.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
