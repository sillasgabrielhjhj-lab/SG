name: Deploy Gabrieldev.sites to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/confident-rubin-sglt4a
    paths:
      - 'velorah/**'
      - '.github/workflows/deploy-velorah.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: velorah/package-lock.json
      - run: npm ci
        working-directory: velorah
      - run: npm run build
        working-directory: velorah
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: velorah/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
